version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medicare
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
